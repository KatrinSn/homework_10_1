[project]
name = "myprj-4"
version = "0.1.0"
description = ""
authors = [
    {name = "Ekaterina",email = "chantea@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
]

[tool.poetry]
packages = [{include = "myprj_4", from = "src"}]


[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
mypy = "^1.18.2"
black = "^25.9.0"
isort = "^7.0.0"

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = 'venv'

[toool.black]
line_length = 119
exclude = '''
(
    /(
        .git
    )/
)
'''

[tool.isort]
max_line_length = 119
lines_after_imports = 1

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
